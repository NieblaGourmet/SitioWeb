<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Niebla Gourmet">
    <meta name="theme-color" content="#00180d">
    <link rel="apple-touch-icon"
        href="https://lh3.googleusercontent.com/aida/ADBb0ui_n6c3U03f1roC638x7wK5_cYQgoUwD-k01yImGcDsK4p5z2WaAzBZNr56gPIYSVTzUvyTvSJS518wMwIkhz6NKF3ISpgY7JNDqTeU_U9NGaE0dVdTlUQbOURtMT44g5gpNr3PWa5S3N-hTZyLBgi1nP9KJmD2iTnPXQYpvCg6sZMMif7QVYpi3-Xq2VuHv7mhesUMGfsuCvyVvHtjBBpEZ3m0tvaSq7699gUhJgP44wMV5h9nFP9snn8">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#152f23",
                        "secondary": "#b6cea6",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#3b674e",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#a2d1b3",
                        "error-container": "#93000a",
                        "background": "#00180d",
                        "inverse-on-surface": "#1c3529",
                        "secondary-fixed": "#d2eac1",
                        "outline-variant": "#414943",
                        "surface-variant": "#203a2d",
                        "on-primary": "#083822",
                        "on-background": "#ccead7",
                        "on-surface-variant": "#c1c9c1",
                        "on-tertiary-container": "#ad8f52",
                        "on-secondary-fixed": "#0e2006",
                        "on-secondary": "#233519",
                        "primary-container": "#02331e",
                        "on-secondary-fixed-variant": "#394c2e",
                        "tertiary-fixed-dim": "#e4c280",
                        "tertiary": "#e4c280",
                        "surface-bright": "#253e31",
                        "outline": "#8b938c",
                        "on-tertiary": "#402d00",
                        "on-primary-fixed": "#002111",
                        "primary": "#a2d1b3",
                        "on-surface": "#ccead7",
                        "on-error": "#690005",
                        "surface": "#00180d",
                        "primary-fixed": "#bdeece",
                        "inverse-surface": "#ccead7",
                        "tertiary-fixed": "#ffdea1",
                        "surface-tint": "#a2d1b3",
                        "secondary-fixed-dim": "#b6cea6",
                        "surface-container-highest": "#203a2d",
                        "on-tertiary-fixed": "#261900",
                        "on-secondary-container": "#a8bf98",
                        "surface-container-lowest": "#001209",
                        "surface-container": "#0a2419",
                        "on-primary-container": "#6f9d81",
                        "surface-dim": "#00180d",
                        "secondary-container": "#3b4e30",
                        "on-tertiary-fixed-variant": "#5a430d",
                        "surface-container-low": "#062015",
                        "on-primary-fixed-variant": "#234f38",
                        "tertiary-container": "#3a2900"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "margin-desktop": "80px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"],
                        "headline-lg": ["EB Garamond"],
                        "headline-lg-mobile": ["EB Garamond"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["EB Garamond"],
                        "headline-md": ["EB Garamond"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
    <style>
        /* Reset & mobile-first base */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow-x: hidden;
            position: relative;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Prevent scroll chaining when drawer is open */
        body.drawer-open {
            overflow: hidden;
            touch-action: none;
        }

        .glass-panel {
            background: rgba(2, 51, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .misty-gradient {
            background: linear-gradient(to bottom, #00180d 0%, #062015 100%);
        }

        .gold-border-top {
            border-top: 1px solid rgba(175, 145, 84, 0.3);
        }

        /* Drawer styling - mobile first slide-out cart */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 85%;
            max-width: 400px;
            background: #0a2419;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            background: rgba(10, 36, 25, 0.98);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            border-left: 1px solid rgba(228, 194, 128, 0.15);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* scroll within drawer */
        .cart-drawer::-webkit-scrollbar {
            width: 4px;
        }

        .cart-drawer::-webkit-scrollbar-track {
            background: #203a2d;
        }

        .cart-drawer::-webkit-scrollbar-thumb {
            background: #af9154;
            border-radius: 8px;
        }

        /* floating cart button */
        .floating-cart-btn {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            right: 20px;
            z-index: 50;
            background: #af9154;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .floating-cart-btn:active {
            transform: scale(0.9) translateY(2px);
            background: #c4a460;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e4c280;
            color: #00180d;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            font-family: 'Hanken Grotesk', sans-serif;
            font-weight: 700;
        }

        /* Main content adjustments for no header */
        main {
            padding-top: 0;
        }

        .hero-mobile {
            margin-top: 0;
        }

        /* swipe to close hint */
        .drawer-header {
            position: sticky;
            top: 0;
            background: rgba(2, 51, 30, 0.9);
            backdrop-filter: blur(12px);
            z-index: 5;
        }

        /* Product grid mobile optimization */
        @media (max-width: 640px) {
            .menu-grid-mobile {
                gap: 1rem;
            }

            .product-card {
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>

<body class="bg-background text-on-background selection:bg-tertiary/30 selection:text-tertiary">

    <!-- Drawer Overlay -->
    <div id="drawerOverlay" class="drawer-overlay"></div>

    <!-- Cart Drawer (offcanvas) -->
    <div id="cartDrawer" class="cart-drawer">
        <div class="drawer-header p-5 border-b border-tertiary/20 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-tertiary">shopping_bag</span>
                <h2 class="font-headline-md text-headline-md text-on-surface text-[22px]">Tu Pedido</h2>
            </div>
            <button id="closeDrawerBtn" class="text-secondary hover:text-tertiary transition p-2 -mr-2">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="flex-1 px-5 py-4 overflow-y-auto">
            <div id="cartItemsContainer" class="space-y-6 mb-6">
                <!-- carrito dinámico js -->
            </div>
            <div id="emptyCartMessage" class="text-center py-12 opacity-70 flex flex-col items-center gap-3">
                <span class="material-symbols-outlined text-4xl text-tertiary/50">restaurant_menu</span>
                <p class="font-body-md text-secondary/70">Tu pedido está vacío.<br>Agrega delicias del menú.</p>
            </div>
        </div>
        <div class="p-5 gold-border-top bg-surface-container/50 pb-[calc(1.25rem+env(safe-area-inset-bottom))]">
            <div id="cartSummary" class="space-y-4">
                <!-- dinámico -->
            </div>
            <button id="checkoutBtn"
                class="w-full mt-5 bg-[#af9154] text-[#02331e] py-4 rounded-lg font-label-md text-label-md hover:brightness-110 active:scale-[0.98] transition-all uppercase tracking-widest font-bold disabled:opacity-40 disabled:cursor-not-allowed">
                Finalizar Pedido
            </button>
            <p class="text-center mt-3 font-body-md text-[11px] text-secondary/40 italic">* Impuestos incluidos</p>
        </div>
    </div>

    <!-- Floating Cart Button -->
    <button id="floatingCartBtn" class="floating-cart-btn">
        <span class="material-symbols-outlined text-[#02331e] text-2xl">shopping_cart</span>
        <span id="cartCounterBadge" class="cart-badge hidden">0</span>
    </button>

    <main class="pb-24">
        <!-- Hero Section / Header Menú (sin TopBar) -->
        <section class="relative h-[340px] min-h-[300px] flex items-center justify-center overflow-hidden">
            <div class="absolute inset-0 z-0">
                <img class="w-full h-full object-cover opacity-40" alt="Niebla Gourmet atmospheric forest"
                    src="./img/fondo.png" />
                <div class="absolute inset-0 bg-gradient-to-b from-transparent via-background/70 to-background"></div>
            </div>
            <div class="relative z-10 text-center px-margin-mobile">
                <h1 class="font-display-lg text-[44px] md:text-[64px] leading-[1.2] text-on-surface mb-3">
                    Niebla Gourmet
                </h1>
                <span class="font-label-md text-label-md text-tertiary uppercase tracking-[0.3em] mb-2 block">
                    Menu Desayunos
                </span>
                <div class="w-20 h-px bg-tertiary/50 mx-auto mt-2"></div>
            </div>
        </section>

        <!-- Menu Grid (diseño móvil con 1 columna, en tablet 2) -->
        <div class="max-w-container-max mx-auto px-gutter py-8">
            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-7">
                <!-- productos inyectados por JS para consistencia (se usa innerHTML desde script) -->
            </div>
        </div>
    </main>

    <script>
        // Base de datos de productos
        const products = [
            { id: 1, name: "Amanecer Típico", price: 20.00, description: "Desayuno tradicional costarricense con gallo pinto, huevos, queso fresco, natilla y plátano maduro asado.", img: "./img/menu/desayunotipico.jpg" },
            { id: 2, name: "Omelette", price: 20.00, description: "Omelette esponjoso relleno de espinacas frescas, champiñones y queso de cabra, servido con pan artesanal.", img: "./img/menu/omelette.jpeg" },
            { id: 3, name: "Huevos del Bosque", price: 20.00, description: "Huevos orgánicos revueltos con hongos silvestres, espárragos y un toque de trufa negra.", img: "./img/menu/omelette.jpeg" },
            { id: 4, name: "Niebla Crocante", price: 20.00, description: "Waffles crujientes de avena y miel, coronados con frutos rojos, yogur cremoso y una llovizna de miel de montaña.", img: "./img/menu/crocante.jpg" },
            { id: 5, name: "Tostadas", price: 20.00, description: "Tostadas de masa madre con tres toppings: palta y huevo poche, tomate cherry y albahaca, y crema de queso con nueces.", img: "./img/menu/tostadas.jpeg" }
        ];
        let cart = []; // { id, quantity }

        // Funciones helpers
        function findProduct(id) { return products.find(p => p.id === id); }

        function getCartItem(id) { return cart.find(i => i.id === id); }

        function updateCartStorage() {
            localStorage.setItem('nieblaCart', JSON.stringify(cart));
            renderCartUI();
            updateCartBadge();
        }

        function addToCart(productId) {
            const existing = getCartItem(productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: productId, quantity: 1 });
            }
            updateCartStorage();
            // animación opcional: abrir drawer si se desea? solo actualiza.
        }

        function removeFromCart(productId) {
            const idx = cart.findIndex(i => i.id === productId);
            if (idx !== -1) {
                if (cart[idx].quantity > 1) {
                    cart[idx].quantity -= 1;
                } else {
                    cart.splice(idx, 1);
                }
            }
            updateCartStorage();
        }

        function deleteItemCompletely(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartStorage();
        }

        function getTotalItems() {
            return cart.reduce((sum, i) => sum + i.quantity, 0);
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartCounterBadge');
            const total = getTotalItems();
            if (total > 0) {
                badge.textContent = total > 99 ? '99+' : total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderProductsGrid() {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            grid.innerHTML = products.map(prod => `
            <div class="group bg-surface-container border border-muted-olive/30 overflow-hidden hover:border-tertiary/40 transition-all duration-500 product-card rounded-lg">
                <div class="aspect-[4/3] overflow-hidden relative">
                    <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" src="${prod.img}" alt="${prod.name}" loading="lazy">
                    <div class="absolute top-4 right-4 bg-background/80 backdrop-blur-md px-3 py-1 text-tertiary font-label-md text-label-md rounded-lg">
                        $${prod.price.toFixed(2)}
                    </div>
                </div>
                <div class="p-6 md:p-7">
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-2 text-xl md:text-2xl">${prod.name}</h3>
                    <p class="font-body-md text-body-md text-secondary/70 mb-5 line-clamp-2 text-sm md:text-base">${prod.description}</p>
                    <button data-id="${prod.id}" class="add-to-cart-btn w-full py-4 border border-secondary/20 font-label-md text-label-md text-tertiary hover:bg-tertiary/10 active:bg-tertiary/20 transition-all flex items-center justify-center gap-2 uppercase tracking-widest rounded-lg">
                        <span class="material-symbols-outlined text-[18px]">add</span>
                        Añadir al Pedido
                    </button>
                </div>
            </div>
        `).join('');
            // attach events
            document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(btn.getAttribute('data-id'));
                    addToCart(id);
                    // pequeño feedback
                    btn.style.transform = "scale(0.97)";
                    setTimeout(() => { btn.style.transform = ""; }, 150);
                });
            });
        }

        function renderCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const emptyMsgDiv = document.getElementById('emptyCartMessage');
            const summaryDiv = document.getElementById('cartSummary');
            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = '';
                emptyMsgDiv.style.display = 'flex';
                summaryDiv.innerHTML = `
                <div class="text-center text-secondary/50 py-4 text-sm">Agrega platos para continuar</div>
                <div class="flex justify-between font-label-md text-secondary/60 opacity-0">-</div>
            `;
                const checkoutBtn = document.getElementById('checkoutBtn');
                if (checkoutBtn) checkoutBtn.disabled = true;
                return;
            }
            emptyMsgDiv.style.display = 'none';
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) checkoutBtn.disabled = false;

            let itemsHtml = '';
            let subtotal = 0;
            cart.forEach(cartItem => {
                const prod = findProduct(cartItem.id);
                if (!prod) return;
                const itemTotal = prod.price * cartItem.quantity;
                subtotal += itemTotal;
                itemsHtml += `
                <div class="flex gap-4 pb-3 border-b border-outline-variant/20">
                    <div class="w-14 h-14 bg-surface-container-high rounded overflow-hidden flex-shrink-0">
                        <img class="w-full h-full object-cover" src="${prod.img}" alt="${prod.name}">
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start mb-1 flex-wrap gap-1">
                            <h4 class="font-label-md text-label-md text-on-surface">${prod.name}</h4>
                            <span class="font-label-md text-label-md text-tertiary">$${itemTotal.toFixed(2)}</span>
                        </div>
                        <div class="flex items-center gap-4 mt-2">
                            <div class="flex items-center gap-2 bg-surface-container-high/60 rounded-full px-2 py-1">
                                <button data-id="${prod.id}" class="cart-decr text-secondary hover:text-primary transition-colors text-sm w-6 h-6 flex items-center justify-center rounded-full">-</button>
                                <span class="font-body-md text-on-surface min-w-[24px] text-center">${cartItem.quantity}</span>
                                <button data-id="${prod.id}" class="cart-incr text-secondary hover:text-primary transition-colors text-sm w-6 h-6 flex items-center justify-center rounded-full">+</button>
                            </div>
                            <button data-id="${prod.id}" class="cart-remove text-[11px] uppercase tracking-wider text-error/70 hover:text-error transition">Eliminar</button>
                        </div>
                    </div>
                </div>
            `;
            });
            container.innerHTML = itemsHtml;

            const servicio = subtotal * 0.10;
            const total = subtotal + servicio;
            summaryDiv.innerHTML = `
            <div class="flex justify-between font-label-md text-label-md text-secondary/60">
                <span>Subtotal</span>
                <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="flex justify-between font-label-md text-label-md text-secondary/60">
                <span>Servicio (10%)</span>
                <span>$${servicio.toFixed(2)}</span>
            </div>
            <div class="flex justify-between items-end pt-2 gold-border-top mt-2">
                <span class="font-headline-md text-headline-md text-on-surface text-xl">Total</span>
                <span class="font-headline-md text-headline-md text-tertiary text-xl">$${total.toFixed(2)}</span>
            </div>
        `;

            // attach cart events dinámicos
            document.querySelectorAll('.cart-incr').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    addToCart(id);
                });
            });
            document.querySelectorAll('.cart-decr').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    removeFromCart(id);
                });
            });
            document.querySelectorAll('.cart-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    deleteItemCompletely(id);
                });
            });
        }

        // Drawer logic
        const drawer = document.getElementById('cartDrawer');
        const overlay = document.getElementById('drawerOverlay');
        const floatingBtn = document.getElementById('floatingCartBtn');
        const closeBtn = document.getElementById('closeDrawerBtn');

        function openDrawer() {
            drawer.classList.add('open');
            overlay.classList.add('active');
            document.body.classList.add('drawer-open');
        }
        function closeDrawer() {
            drawer.classList.remove('open');
            overlay.classList.remove('active');
            document.body.classList.remove('drawer-open');
        }
        floatingBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            openDrawer();
        });
        closeBtn?.addEventListener('click', closeDrawer);
        overlay?.addEventListener('click', closeDrawer);

        // checkout simulación
        const checkoutFinal = document.getElementById('checkoutBtn');
        if (checkoutFinal) {
            checkoutFinal.addEventListener('click', () => {
                if (cart.length === 0) return;
                alert('✨ Pedido recibido. ¡En breve recibirás tu experiencia Niebla Gourmet! ✨');
                cart = [];
                updateCartStorage();
                closeDrawer();
            });
        }

        // Initialize products y cargar carrito de localStorage si existe
        function loadCartFromStorage() {
            const saved = localStorage.getItem('nieblaCart');
            if (saved) {
                try {
                    cart = JSON.parse(saved);
                    // validar estructura
                    if (!Array.isArray(cart)) cart = [];
                } catch (e) { cart = []; }
            } else {
                cart = [];
            }
            renderCartUI();
            updateCartBadge();
        }

        renderProductsGrid();
        loadCartFromStorage();
        // re-render al cambiar
        window.addEventListener('storage', () => loadCartFromStorage());
    </script>
</body>

</html>
